services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carlos-portfolio
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --host 0.0.0.0

volumes:
  portfolio_node_modules:
